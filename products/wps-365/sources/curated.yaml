version: 1

groups:
  calendar:
    description: 日历、日程与忙闲管理
    children:
      event:
        description: 日程的增删改查与搜索
      event-room:
        description: 日程会议室管理
      event-instance:
        description: 重复日程实例查询
      event-attendee:
        description: 日程参与者管理
      event-minutes:
        description: 日程会议纪要
      free-busy:
        description: 忙闲信息查询
      primary:
        description: 主日历批量查询

  im:
    description: 消息与群会话管理
    children:
      message:
        description: 消息发送与撤回
      chat:
        description: 群会话管理
      p2p-chat:
        description: 单聊会话查询
      unread-chat:
        description: 未读会话统计
      chat-member:
        description: 群成员管理
      chat-message:
        description: 会话消息记录

  user:
    description: 企业用户与组织架构
    children:
      dept:
        description: 用户所属部门查询

  mail:
    description: 邮箱与邮件管理
    children:
      mailbox:
        description: 邮箱列表管理
      mailbox-folder:
        description: 邮箱文件夹管理
      mailbox-subfolder:
        description: 邮箱子文件夹管理
      message:
        description: 邮件消息管理
      draft:
        description: 邮件草稿管理

  drive:
    description: 云文档与文件管理
    children:
      file:
        description: 文件与文件夹操作
      file-content:
        description: 文件正文内容
      file-path:
        description: 文件路径查询
      recent-file:
        description: 最近访问的文件
      starred-file:
        description: 收藏的文件
      frequent-file:
        description: 常用文件
      link:
        description: 文件分享链接管理
      file-version:
        description: 文件版本管理

  dbsheet:
    description: 多维表数据管理
    children:
      schema:
        description: 多维表结构信息
      sheet:
        description: 数据表管理
      field:
        description: 字段管理
      record:
        description: 记录的增删改查
      record-page:
        description: 记录分页查询

  meeting:
    description: 在线会议管理
    children:
      participant:
        description: 参会人管理
      minute:
        description: 会议纪要
      minute-summary:
        description: 会议纪要摘要
      minute-transcript:
        description: 会议纪要转写
      recording:
        description: 会议录制
      recording-summary:
        description: 录制摘要
      recording-transcript:
        description: 录制转写

commands:
  - id: calendar.list
    command: calendar list
    summary: 查询日历列表
    description: 查询当前可访问的日历列表，支持分页。
    method: GET
    path: /v7/calendars
    response_schema_ref: "#/components/schemas/list_calendars_resp_body"
    flags:
      - name: page-token
        type: string
        description: 分页标记，传入上一次响应中的 next_page_token
        to: query.page_token
      - name: page-size
        type: integer
        default: 20
        description: 每页返回的日历数量，默认为 20，最大值为 20
        to: query.page_size
    examples:
      - command: wps365-cli calendar list
        description: 查询第一页日历列表
      - command: 'wps365-cli calendar list --page-size 10 --page-token "next-token"'
        description: 按分页标记继续查询日历列表
  - id: calendar.event.create
    command: calendar event create
    summary: 创建日程
    description: 在指定日历中创建日程，开始时间和结束时间使用 RFC3339 格式。
    method: POST
    path: /v7/calendars/{calendar_id}/events/create
    request_schema_ref: "#/components/schemas/create_event_req_body"
    response_schema_ref: "#/components/schemas/create_event_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
    flags:
      - name: start
        type: string
        required: true
        description: 起始时间，RFC3339 格式，例如 2024-01-15T14:30:00+08:00
      - name: end
        type: string
        required: true
        description: 结束时间，RFC3339 格式，例如 2024-01-15T15:30:00+08:00
      - name: name
        type: string
        description: 日程标题
      - name: description
        type: string
        description: 日程描述，最长 2000 字符
      - name: location
        type: string
        description: 地点名称
      - name: reminders
        type: string
        description: 提醒时间，单位为分钟，多个用逗号分隔
      - name: visibility
        type: string
        description: 可见性
      - name: free-busy-status
        type: string
        description: 忙闲状态
      - name: recurrence-body
        type: string
        description: 重复规则 JSON
      - name: online-meeting-body
        type: string
        description: 在线会议配置 JSON
    body:
      bindings:
        - from_flag: name
          to: summary
        - from_flag: description
          to: description
        - from_flag: start
          to: start_time.datetime
        - from_flag: end
          to: end_time.datetime
        - from_flag: location
          to: locations[0].name
        - from_flag: reminders
          to: reminders
          transform: "split_csv | to_int | wrap(minutes)"
        - from_flag: visibility
          to: visibility
        - from_flag: free-busy-status
          to: free_busy_status
        - from_flag: recurrence-body
          to: recurrence
          transform: parse_json
        - from_flag: online-meeting-body
          to: online_meeting
          transform: parse_json
    examples:
      - command: 'wps365-cli calendar event create primary --name "项目评审" --start "2024-01-15T14:30:00+08:00" --end "2024-01-15T15:30:00+08:00"'
        description: 在主日历中创建一个日程
      - command: 'wps365-cli calendar event create primary --name "项目评审" --start "2024-01-15T14:30:00+08:00" --end "2024-01-15T15:30:00+08:00" --reminders "30,10"'
        description: 创建带多个提醒时间的日程
      - command: 'wps365-cli calendar event create primary --name "周会" --start "2024-01-15T14:30:00+08:00" --end "2024-01-15T15:30:00+08:00" --location "3F 会议室"'
        description: 创建带地点的日程
  - id: calendar.event-room.list
    command: calendar event-room list
    summary: 查询日程的会议室列表
    description: 获取指定日程关联的会议室列表。
    method: GET
    path: /v7/calendars/{calendar_id}/events/{event_id}/meeting_rooms
    response_schema_ref: "#/components/schemas/list_event_meeting_rooms_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    examples:
      - command: 'wps365-cli calendar event-room list primary "event_id_xxx"'
        description: 查询主日历下某日程的会议室列表
  - id: calendar.event-room.add
    command: calendar event-room add
    summary: 批量添加日程会议室
    description: 为指定日程批量添加会议室，最多 40 个。
    method: POST
    path: /v7/calendars/{calendar_id}/events/{event_id}/meeting_rooms/batch_create
    request_schema_ref: "#/components/schemas/batch_create_event_meeting_room_req_body"
    response_schema_ref: "#/components/schemas/batch_create_event_meeting_room_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    flags:
      - name: room-ids
        type: string
        required: true
        description: 会议室 id，多个用逗号分隔，最多 40 个
    body:
      bindings:
        - from_flag: room-ids
          to: room_ids
          transform: split_csv
    examples:
      - command: 'wps365-cli calendar event-room add primary "event_id_xxx" --room-ids "room_1,room_2"'
        description: 为日程批量添加两个会议室
  - id: calendar.event-room.remove
    command: calendar event-room remove
    summary: 批量删除日程会议室
    description: 从指定日程中批量移除会议室，最多 50 个。
    method: POST
    path: /v7/calendars/{calendar_id}/events/{event_id}/meeting_rooms/batch_delete
    request_schema_ref: "#/components/schemas/batch_delete_event_meeting_room_req_body"
    response_schema_ref: "#/components/schemas/batch_delete_event_meeting_room_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    flags:
      - name: room-ids
        type: string
        required: true
        description: 会议室 id，多个用逗号分隔，最多 50 个
    body:
      bindings:
        - from_flag: room-ids
          to: room_ids
          transform: split_csv
    examples:
      - command: 'wps365-cli calendar event-room remove primary "event_id_xxx" --room-ids "room_1"'
        description: 从日程中移除指定的会议室
  - id: calendar.create
    command: calendar create
    summary: 创建日历
    description: 创建一个新日历。
    method: POST
    path: /v7/calendars/create
    request_schema_ref: "#/components/schemas/create_calendar_req_body"
    response_schema_ref: "#/components/schemas/create_calendar_resp_body"
    flags:
      - name: name
        type: string
        required: true
        description: 日历标题，长度 1–40
    body:
      bindings:
        - from_flag: name
          to: summary
    examples:
      - command: 'wps365-cli calendar create --name "项目日历"'
        description: 创建一个名为"项目日历"的日历
  - id: calendar.get
    command: calendar get
    summary: 查看日历
    description: 查看指定日历的详细信息。
    method: GET
    path: /v7/calendars/{calendar_id}
    response_schema_ref: "#/components/schemas/get_calendar_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
    examples:
      - command: 'wps365-cli calendar get primary'
        description: 查看主日历信息
      - command: 'wps365-cli calendar get "cal_xxx"'
        description: 查看指定日历信息
  - id: calendar.update
    command: calendar update
    summary: 修改日历
    description: 修改指定日历的标题。
    method: POST
    path: /v7/calendars/{calendar_id}/update
    request_schema_ref: "#/components/schemas/update_calendar_req_body"
    response_schema_ref: "#/components/schemas/update_calendar_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id
        to: path.calendar_id
    flags:
      - name: name
        type: string
        description: 新的日历标题，长度 1–40
    body:
      bindings:
        - from_flag: name
          to: summary
    examples:
      - command: 'wps365-cli calendar update "cal_xxx" --name "新名称"'
        description: 修改日历标题
  - id: calendar.delete
    command: calendar delete
    summary: 删除日历
    description: 删除指定日历。
    method: POST
    path: /v7/calendars/{calendar_id}/delete
    response_schema_ref: "#/components/schemas/delete_calendar_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id
        to: path.calendar_id
    examples:
      - command: 'wps365-cli calendar delete "cal_xxx"'
        description: 删除指定日历
  - id: calendar.subscribe
    command: calendar subscribe
    summary: 订阅日历
    description: 订阅指定日历。
    method: POST
    path: /v7/calendars/{calendar_id}/subscribe
    response_schema_ref: "#/components/schemas/calendar_subscribe_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id
        to: path.calendar_id
    examples:
      - command: 'wps365-cli calendar subscribe "cal_xxx"'
        description: 订阅指定日历
  - id: calendar.unsubscribe
    command: calendar unsubscribe
    summary: 取消订阅日历
    description: 取消订阅指定日历。
    method: POST
    path: /v7/calendars/{calendar_id}/unsubscribe
    response_schema_ref: "#/components/schemas/calendar_unsubscribe_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id
        to: path.calendar_id
    examples:
      - command: 'wps365-cli calendar unsubscribe "cal_xxx"'
        description: 取消订阅指定日历
  - id: calendar.event.list
    command: calendar event list
    summary: 查询日程列表
    description: 查询指定日历下的日程列表，支持按时间区间筛选与增量同步。
    method: GET
    path: /v7/calendars/{calendar_id}/events
    response_schema_ref: "#/components/schemas/list_events_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
    flags:
      - name: start
        type: string
        description: 起始时间，RFC3339 格式，与 --end 配合使用，区间不超过 31 天
        to: query.start_time
      - name: end
        type: string
        description: 结束时间，RFC3339 格式
        to: query.end_time
      - name: page-token
        type: string
        description: 分页标记
        to: query.page_token
      - name: page-size
        type: integer
        default: 30
        description: 每页数量，1–100，默认 30
        to: query.page_size
      - name: sync-token
        type: string
        description: 增量同步 token
        to: query.sync_token
      - name: anchor-time
        type: string
        description: 锚点时间，RFC3339 格式
        to: query.anchor_time
      - name: with-cancelled
        type: boolean
        description: 增量同步时是否包含已取消的日程
        to: query.with_cancelled
    examples:
      - command: 'wps365-cli calendar event list primary'
        description: 查询主日历下的日程列表
      - command: 'wps365-cli calendar event list primary --start "2024-01-01T00:00:00+08:00" --end "2024-01-31T23:59:59+08:00"'
        description: 查询指定时间区间内的日程
      - command: 'wps365-cli calendar event list primary --page-size 50'
        description: 查询日程列表并设置每页数量
  - id: calendar.event.get
    command: calendar event get
    summary: 查询日程
    description: 查询指定日程的详细信息。
    method: GET
    path: /v7/calendars/{calendar_id}/events/{event_id}
    response_schema_ref: "#/components/schemas/get_event_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    examples:
      - command: 'wps365-cli calendar event get primary "evt_xxx"'
        description: 查看主日历下某日程的详细信息
  - id: calendar.event.update
    command: calendar event update
    summary: 修改日程
    description: 修改指定日程，支持增量更新。对于重复日程，可通过 --mod-type 指定修改范围。
    method: POST
    path: /v7/calendars/{calendar_id}/events/{event_id}/update
    request_schema_ref: "#/components/schemas/update_event_req_body"
    response_schema_ref: "#/components/schemas/update_event_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    flags:
      - name: name
        type: string
        description: 日程标题
      - name: description
        type: string
        description: 日程描述
      - name: start
        type: string
        description: 起始时间，RFC3339 格式
      - name: end
        type: string
        description: 结束时间，RFC3339 格式
      - name: location
        type: string
        description: 地点名称
      - name: reminders
        type: string
        description: 提醒时间，单位为分钟，多个用逗号分隔
      - name: visibility
        type: string
        description: 可见性
      - name: free-busy-status
        type: string
        description: 忙闲状态
      - name: mod-type
        type: string
        description: 重复日程修改范围，可选 one 或 all
      - name: which-day-time
        type: string
        description: 重复日程中要改的那一天的开始时间（毫秒时间戳），mod-type=one 时必填
      - name: no-notification
        type: boolean
        description: 不向参与者发更新通知
      - name: recurrence-body
        type: string
        description: 重复规则 JSON
      - name: online-meeting-body
        type: string
        description: 在线会议配置 JSON
    body:
      bindings:
        - from_flag: name
          to: summary
        - from_flag: description
          to: description
        - from_flag: start
          to: start_time.datetime
        - from_flag: end
          to: end_time.datetime
        - from_flag: location
          to: locations[0].name
        - from_flag: reminders
          to: reminders
          transform: "split_csv | to_int | wrap(minutes)"
        - from_flag: visibility
          to: visibility
        - from_flag: free-busy-status
          to: free_busy_status
        - from_flag: mod-type
          to: mod_type
        - from_flag: which-day-time
          to: which_day_time
          transform: to_int
        - from_flag: no-notification
          to: is_notification
          transform: "to_bool | negate"
        - from_flag: recurrence-body
          to: recurrence
          transform: parse_json
        - from_flag: online-meeting-body
          to: online_meeting
          transform: parse_json
    examples:
      - command: 'wps365-cli calendar event update primary "evt_xxx" --name "新标题"'
        description: 修改日程标题
      - command: 'wps365-cli calendar event update primary "evt_xxx" --start "2024-01-16T14:30:00+08:00" --end "2024-01-16T15:30:00+08:00" --mod-type all'
        description: 修改重复日程的所有实例时间
  - id: calendar.event.delete
    command: calendar event delete
    summary: 删除日程
    description: 删除指定日程。对于重复日程，可通过 --mod-type 指定删除范围。
    method: POST
    path: /v7/calendars/{calendar_id}/events/{event_id}/delete
    request_schema_ref: "#/components/schemas/delete_event_req_body"
    response_schema_ref: "#/components/schemas/delete_event_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    flags:
      - name: mod-type
        type: string
        description: 重复日程删除范围，可选 one 或 all
      - name: which-day-time
        type: string
        description: 重复日程中要删的那一天的开始时间（毫秒时间戳），mod-type=one 时必填
      - name: no-notification
        type: boolean
        description: 不向参与者发通知
    body:
      bindings:
        - from_flag: mod-type
          to: mod_type
        - from_flag: which-day-time
          to: which_day_time
          transform: to_int
        - from_flag: no-notification
          to: is_notification
          transform: "to_bool | negate"
    examples:
      - command: 'wps365-cli calendar event delete primary "evt_xxx"'
        description: 删除指定日程
      - command: 'wps365-cli calendar event delete primary "evt_xxx" --mod-type all'
        description: 删除重复日程的所有实例

  - id: calendar.event-minutes.create
    command: calendar event-minutes create
    summary: 创建会议纪要
    description: 为指定日程创建会议纪要，纪要以文档形式展示，成功创建后会返回纪要文档 URL。日程内至少需要有 1 个参与人。
    method: POST
    path: /v7/calendars/{calendar_id}/events/{event_id}/meeting_minutes/create
    response_schema_ref: "#/components/schemas/create_event_meeting_minutes_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    examples:
      - command: 'wps365-cli calendar event-minutes create primary "evt_xxx"'
        description: 为指定日程创建会议纪要

  - id: calendar.event.search
    command: calendar event search
    summary: 搜索日程
    description: 在指定日历中搜索日程。
    method: POST
    path: /v7/calendars/{calendar_id}/events/search
    request_schema_ref: "#/components/schemas/search_events_req_body"
    response_schema_ref: "#/components/schemas/search_events_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
    flags:
      - name: keyword
        type: string
        required: true
        description: 搜索关键词，长度 1–100
      - name: page-size
        type: integer
        default: 200
        description: 每页数量，1–500，默认 200
      - name: page-token
        type: string
        description: 分页标记
    body:
      bindings:
        - from_flag: keyword
          to: keyword
        - from_flag: page-size
          to: page_size
        - from_flag: page-token
          to: page_token
    examples:
      - command: 'wps365-cli calendar event search primary --keyword "评审"'
        description: 在主日历中搜索包含"评审"的日程
  - id: calendar.event.respond
    command: calendar event respond
    summary: 答复日程邀请
    description: 答复日程邀请，支持接受、拒绝、暂定。
    method: POST
    path: /v7/calendars/{calendar_id}/events/{event_id}/respond
    request_schema_ref: "#/components/schemas/respond_event_req_body"
    response_schema_ref: "#/components/schemas/respond_event_resp_body"
    args:
      - name: calendar-id
        required: true
        description: 日历 id，可使用 primary 指代主日历
        to: path.calendar_id
      - name: event-id
        required: true
        description: 日程 id
        to: path.event_id
    flags:
      - name: status
        type: string
        required: true
        description: 答复状态，可选 accepted、declined、tentative
      - name: mod-type
        type: string
        required: true
        description: 答复范围，可选 normal、one、all
        default: normal
      - name: which-day-time
        type: string
        required: true
        description: 日程开始时间戳（毫秒）
    body:
      bindings:
        - from_flag: status
          to: response_status
        - from_flag: mod-type
          to: mod_type
        - from_flag: which-day-time
          to: which_day_time
          transform: to_int
    examples:
      - command: 'wps365-cli calendar event respond primary "evt_xxx" --status accepted --which-day-time "1705305000000"'
        description: 接受日程邀请
      - command: 'wps365-cli calendar event respond primary "evt_xxx" --status declined --which-day-time "1705305000000"'
        description: 拒绝日程邀请

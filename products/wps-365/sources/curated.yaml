    method: POST
    path: /v7/calendars/{calendar_id}/events/{event_id}/attendees/batch_create
    request_schema_ref: "#/components/schemas/batch_create_event_attendee_req_body"
    response_schema_ref: "#/components/schemas/batch_create_event_attendee_resp_body"
    args:
      - name: calendar-id

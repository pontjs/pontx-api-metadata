  # ── mail: 邮件操作 ──────────────────────────────────────────────
  - id: mail.message.list
    command: mail message list
    summary: 获取邮件列表
    description: 获取指定邮箱某目录下的邮件列表。folder-id 可为目录 ID 或系统标识（inbox、drafts、sent、junk、trash）。
    method: GET
    path: /v7/mailboxes/{mailbox_id}/folders/{folder_id}/messages
    response_schema_ref: "#/components/schemas/list_mail_messages_in_folder_resp_body"
    args:
      - name: mailbox-id
        required: true
        description: 邮箱 ID
        to: path.mailbox_id
      - name: folder-id
        required: true
        description: 目录 ID 或系统标识（inbox、drafts、sent、junk、trash）
        to: path.folder_id
    flags:
      - name: page-size
        type: integer
        description: 每页数量，1–10
        to: query.page_size
      - name: page-token
        type: string
        description: 分页标记
        to: query.page_token
      - name: start
        type: integer
        description: 起始时间戳
        to: query.start_time
      - name: end
        type: integer
        description: 结束时间戳
        to: query.end_time
      - name: filter
        type: string
        description: 过滤条件，可选 unread、flagged，多个用逗号分隔
        to: query.filter
      - name: thread-id
        type: string
        description: 会话 ID，按会话筛选
        to: query.thread_id
    examples:
      - command: 'wps365-cli mail message list "mbx_xxx" inbox --page-size 10'
        description: 查询收件箱中的邮件列表
      - command: 'wps365-cli mail message list "mbx_xxx" inbox --page-size 5 --filter "unread"'
        description: 查询收件箱中的未读邮件
  - id: mail.message.get
    command: mail message get
    summary: 获取邮件详情
    description: 获取一封邮件的详细内容。
    method: GET
    path: /v7/mailboxes/{mailbox_id}/folders/{folder_id}/messages/{message_id}
    response_schema_ref: "#/components/schemas/get_mail_message_resp_body"
    args:
      - name: mailbox-id
        required: true
        description: 邮箱 ID
        to: path.mailbox_id
      - name: folder-id
        required: true
        description: 目录 ID 或系统标识
        to: path.folder_id
      - name: message-id
        required: true
        description: 邮件 ID
        to: path.message_id
    flags:
      - name: with-ocr-body
        type: boolean
        description: 是否返回 OCR 正文
        to: query.with_ocr_body
      - name: with-importance-flag
        type: boolean
        description: 是否返回重要性标识
        to: query.with_importance_flag
    examples:
      - command: 'wps365-cli mail message get "mbx_xxx" inbox "msg_xxx"'
        description: 查看一封邮件的详细内容
  - id: mail.draft.create
    command: mail draft create
    summary: 创建草稿
    description: 创建草稿并放入草稿箱。
    method: POST
    path: /v7/mailboxes/{mailbox_id}/messages/create
    request_schema_ref: "#/components/schemas/create_mail_draft_req_body"
    response_schema_ref: "#/components/schemas/create_mail_draft_resp_body"
    args:
      - name: mailbox-id
        required: true
        description: 邮箱 ID
        to: path.mailbox_id
    flags:
      - name: subject
        type: string
        description: 邮件标题
      - name: body
        type: string
        description: 邮件正文
      - name: to
        type: string
        description: 收件人邮箱地址，多个用逗号分隔
      - name: cc
        type: string
        description: 抄送人邮箱地址，多个用逗号分隔
      - name: bcc
        type: string
        description: 密送人邮箱地址，多个用逗号分隔
    body:
      bindings:
        - from_flag: subject
          to: subject
        - from_flag: body
          to: body
        - from_flag: to
          to: to_recipients
          transform: "split_csv | wrap(email_address)"
        - from_flag: cc
          to: cc_recipients
          transform: "split_csv | wrap(email_address)"
        - from_flag: bcc
          to: bcc_recipients
          transform: "split_csv | wrap(email_address)"
    examples:
      - command: 'wps365-cli mail draft create "mbx_xxx" --subject "测试邮件" --body "这是正文" --to "a@example.com,b@example.com"'
        description: 创建一封草稿邮件
  - id: mail.draft.send

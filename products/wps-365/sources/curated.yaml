  - id: im.message.send
    command: im message send
    summary: 发送文本消息
    description: 向一类接收对象批量发送 IM 文本消息，默认向用户发送纯文本。
    method: POST
    path: /v7/messages/batch_create
    request_schema_ref: "#/components/schemas/batch_create_message_req_body"
    response_schema_ref: "#/components/schemas/batch_create_message_resp_body"
    flags:
      - name: to
        type: string
        required: true
        description: 接收者 ID，多个用逗号分隔；同一次调用中的接收者类型必须一致
      - name: text
        type: string
        required: true
        description: 发送的文本内容
      - name: receiver-type
        type: string
        default: user
        description: 接收者类型，可选 user、dept、company、chat、enterprise_partner、enterprise_partner_dept、enterprise_partner_user
      - name: partner-id
        type: string
        description: 关联组织 ID；当 receiver-type 为关联组织类型时使用
      - name: text-format
        type: string
        default: plain
        description: 文本格式，可选 plain 或 markdown
      - name: mentions-body
        type: string
        description: 高级参数，传入 mentions JSON，用于 <at ...> 标签对应的 at 信息
      - name: id-type
        type: string
        default: internal
        description: 高级参数，对应请求头 X-Kso-Id-Type
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    body:
      defaults:
        type: text
        receivers[0].type: user
        content.text.type: plain
      bindings:
        - from_flag: to
          to: receivers[0].receiver_ids
          transform: split_csv
        - from_flag: text
          to: content.text.content
        - from_flag: receiver-type
          to: receivers[0].type
        - from_flag: partner-id
          to: receivers[0].partner_id
        - from_flag: text-format
          to: content.text.type
        - from_flag: mentions-body
          to: mentions
          transform: parse_json
    examples:
      - command: 'wps365-cli im message send --to "u1,u2" --text "hello"'
        description: 向两个用户发送纯文本消息
      - command: 'wps365-cli im message send --receiver-type dept --to "dept_1,dept_2" --text "请查收通知"'
        description: 向多个部门发送同一条文本消息
      - command: 'wps365-cli im message send --to u1 --text "**hello**" --text-format markdown'
        description: 向单个用户发送 Markdown 文本消息

    method: POST
    path: /v7/mailboxes/{mailbox_id}/messages/{message_id}/send
    response_schema_ref: "#/components/schemas/send_mail_message_resp_body"
    args:
      - name: mailbox-id
        required: true
        description: 邮箱 ID
        to: path.mailbox_id
      - name: message-id
        required: true
        description: 邮件 ID（草稿 ID）
        to: path.message_id
    examples:
      - command: 'wps365-cli mail draft send "mbx_xxx" "msg_xxx"'
        description: 发送草稿箱中的邮件

  # ============================================================
  # dbsheet 多维表格
  # ============================================================

  # --- schema ---

  - id: dbsheet.schema.get
    command: dbsheet schema get
    summary: 获取多维表格 schema
    description: 获取多维表格的完整 schema，包含所有数据表、字段和视图信息。
    method: GET
    path: /v7/coop/dbsheet/{file_id}/schema
    response_schema_ref: "#/components/schemas/dbsheet_get_schema_resp_body"
    args:
      - name: file-id
        required: true
        description: 文件 ID
        to: path.file_id
    examples:
      - command: wps365-cli dbsheet schema get f_abc123
        description: 获取多维表格 schema

  # --- sheets ---

  - id: dbsheet.sheet.create
    command: dbsheet sheet create
    summary: 创建数据表
    description: 在多维表格中创建新的数据表。
    method: POST
    path: /v7/coop/dbsheet/{file_id}/sheets/create
    request_schema_ref: "#/components/schemas/coop_dbsheet_create_sheet_req_body"
    response_schema_ref: "#/components/schemas/dbsheet_create_sheet_resp_body"
    args:
      - name: file-id
        required: true
        description: 文件 ID
        to: path.file_id
    flags:
      - name: name
        type: string
        required: false
        description: 数据表名称
      - name: fields-body
        type: string
        required: true
        description: 字段定义 JSON 数组（字段类型使用 PascalCase，如 MultiLineText、SingleSelect）
      - name: views-body
        type: string
        required: true
        description: 视图定义 JSON 数组（视图类型使用 PascalCase，如 Grid、Kanban）
      - name: after-sheet-id
        type: integer
        required: false
        description: 插入到指定数据表之后（数据表 ID）
      - name: before-sheet-id
        type: integer
        required: false
        description: 插入到指定数据表之前（数据表 ID）
    body:
      defaults:
        position: {}
      bindings:
        - from_flag: name
          to: name
        - from_flag: fields-body
          to: fields
          transform: parse_json
        - from_flag: views-body
          to: views
          transform: parse_json
        - from_flag: after-sheet-id
          to: position.after_sheet_id
          transform: to_int
        - from_flag: before-sheet-id
          to: position.before_sheet_id
          transform: to_int
    examples:
      - command: >-
          wps365-cli dbsheet sheet create f_abc123 --name "任务跟踪"
          --fields-body '[{"name":"任务名","type":"MultiLineText"},{"name":"状态","type":"SingleSelect"}]'
          --views-body '[{"name":"默认视图","type":"Grid"}]'
        description: 创建包含两个字段的数据表

  - id: dbsheet.sheet.update
    command: dbsheet sheet update
    summary: 更新数据表
    description: 更新数据表（重命名）。
    method: POST
    path: /v7/coop/dbsheet/{file_id}/sheets/{sheet_id}/update
    request_schema_ref: "#/components/schemas/coop_dbsheet_update_sheet_req_body"
    response_schema_ref: "#/components/schemas/dbsheet_update_sheet_resp_body"
    args:
      - name: file-id
        required: true
        description: 文件 ID
        to: path.file_id
      - name: sheet-id
        required: true
        description: 数据表 ID
        to: path.sheet_id
    flags:
      - name: name
        type: string
        required: false
        description: 新数据表名称
    body:
      bindings:
        - from_flag: name
          to: name
    examples:
      - command: wps365-cli dbsheet sheet update f_abc123 12345 --name "新表名"
        description: 重命名数据表

  - id: dbsheet.sheet.delete
    command: dbsheet sheet delete
    summary: 删除数据表

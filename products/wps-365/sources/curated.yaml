        required: false
        description: ID 类型
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    examples:
      - command: wps365-cli user dept list u123456
        description: 获取用户所在部门列表
  # ── mail: 邮箱管理 ──────────────────────────────────────────────
  - id: mail.mailbox.list
    command: mail mailbox list

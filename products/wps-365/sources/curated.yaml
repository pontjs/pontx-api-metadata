  - id: meeting.participant.remove
    command: meeting participant remove
    summary: 移除参会人
    description: 将参会人从会议中移除，单次最多 20 个。
    method: POST
    path: /v7/meetings/{meeting_id}/participants/remove
    request_schema_ref: "#/components/schemas/meeting_remove_participants_req_body"
    response_schema_ref: "#/components/schemas/meeting_remove_participants_resp_body"
    args:
      - name: meeting-id
        required: true
        description: 会议 ID
        to: path.meeting_id
    flags:
      - name: user-ids
        type: string
        required: true
        description: 被移除用户 ID，多个用逗号分隔，最多 20 个
      - name: id-type
        type: string
        description: 用户 ID 类型
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    body:
      bindings:

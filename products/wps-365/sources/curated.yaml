    summary: 邀请参会人
    description: 邀请参会人进入会议，单次最多 20 个。
    method: POST
    path: /v7/meetings/{meeting_id}/participants/invite
    request_schema_ref: "#/components/schemas/meeting_invite_participants_req_body"
    response_schema_ref: "#/components/schemas/meeting_invite_participants_resp_body"
    args:
      - name: meeting-id
        required: true
        description: 会议 ID
        to: path.meeting_id
    flags:
      - name: invitees
        type: string
        required: true
        description: 被邀请人用户 ID，多个用逗号分隔，最多 20 个
      - name: id-type
        type: string
        description: 用户 ID 类型
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    body:
      bindings:
        - from_flag: invitees
          to: invitees
          transform: "split_csv | wrap(type=user, user_id)"

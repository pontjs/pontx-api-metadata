        description: 高级参数，传入 mentions JSON
      - name: id-type
        type: string
        default: internal
        description: 高级参数，对应请求头 X-Kso-Id-Type
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    body:
      defaults:
        type: text
        content.text.type: plain
      bindings:
        - from_flag: text
          to: content.text.content
        - from_flag: text-format
          to: content.text.type
        - from_flag: mentions-body
          to: mentions
          transform: parse_json
    examples:
      - command: 'wps365-cli im chat-message reply "chat_xxx" "msg_xxx" --text "收到"'
        description: 回复一条纯文本消息
  - id: im.message.recall
    command: im message recall
    summary: 撤回消息
    description: 撤回消息。
    method: POST
    path: /v7/messages/{message_id}/recall
    response_schema_ref: "#/components/schemas/recall_message_resp_body"
    args:
      - name: message-id
        required: true
        description: 消息 ID
        to: path.message_id
    examples:
      - command: 'wps365-cli im message recall "msg_xxx"'
        description: 撤回指定消息
  - id: user.me
    command: user me
    summary: 获取当前用户信息
    description: 获取当前用户信息
    method: GET
    path: /v7/users/current
    response_schema_ref: "#/components/schemas/get_current_user_resp_body"
    examples:
      - command: wps365-cli user me
        description: 获取当前用户信息
  - id: user.list
    command: user list
    summary: 列出所有用户
    description: 查询企业用户列表，支持按状态过滤和分页，仅支持应用身份。
    method: GET
    path: /v7/users
    response_schema_ref: "#/components/schemas/list_users_resp_body"
    flags:
      - name: status
        type: string[]
        repeatable: true
        default: ["active"]
        description: "用户状态，可选值：active、notactive、disabled"
        to: query.status
        # TODO(F4): 待确认 API 是否接受 ?status=active,disabled 格式后，统一为逗号分隔
      - name: page-size
        type: integer
        required: false
        default: 10
        description: 分页大小，默认 10，最大 50
        to: query.page_size
      - name: page-token
        type: string
        required: false
        description: 分页标记
        to: query.page_token
      - name: with-total
        type: boolean
        required: false
        description: 是否返回总数
        to: query.with_total
      - name: with-dept
        type: boolean
        required: false
        description: 是否返回部门信息
        to: query.with_dept
      - name: id-type
        type: string
        required: false
        description: ID 类型
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    examples:
      - command: wps365-cli user list --status active
        description: 列出所有正常状态的用户
      - command: wps365-cli user list --status active --status disabled --page-size 50
        description: 列出正常和禁用状态的用户，每页 50 条
  - id: user.get
    command: user get
    summary: 获取指定用户
    description: |
      基于不同标识查询用户信息，仅支持应用身份。
      默认按 user_id 查询（GET），可通过 --type 切换为按邮箱、手机号或外部 ID 批量查询（POST）。
    method: GET
    path: /v7/users/{user_id}
    response_schema_ref: "#/components/schemas/get_user_resp_body"
    args:
      - name: identifier
        required: true
        description: 用户标识（user_id / 邮箱 / 手机号 / 外部 ID，多个用逗号分隔）
        to: path.user_id
    flags:
      - name: type
        type: string
        required: false
        default: id
        description: "查询类型：id（默认）、email、phone、external-id"
      - name: status
        type: string
        required: false
        description: "用户状态过滤，多个用逗号分隔，可选值：active、notactive、disabled"
      - name: with-dept
        type: boolean
        required: false
        description: 是否返回部门信息
        to: query.with_dept
      - name: id-type
        type: string
        required: false
        description: ID 类型
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    dispatch:
      flag: type
      default: id
      routes:
        - when: email
          method: POST
          path: /v7/users/by_emails
          request_schema_ref: "#/components/schemas/list_users_by_emails_req_body"
          response_schema_ref: "#/components/schemas/list_users_by_emails_resp_body"
          body:
            bindings:
              - from_arg: identifier
                to: emails
                transform: split_csv
              - from_flag: status
                to: status
                transform: split_csv
              - from_flag: with-dept
                to: with_dept
        - when: phone
          method: POST
          path: /v7/users/by_phones
          request_schema_ref: "#/components/schemas/list_users_by_phones_req_body"
          response_schema_ref: "#/components/schemas/list_users_by_phones_resp_body"
          body:
            bindings:
              - from_arg: identifier
                to: phones
                transform: split_csv
              - from_flag: status
                to: status
                transform: split_csv
              - from_flag: with-dept
                to: with_dept
        - when: external-id
          method: POST
          path: /v7/users/by_ex_user_ids
          request_schema_ref: "#/components/schemas/list_users_by_ex_user_ids_req_body"
          response_schema_ref: "#/components/schemas/list_users_by_ex_user_ids_resp_body"
          body:
            bindings:
              - from_arg: identifier
                to: ex_user_ids
                transform: split_csv
              - from_flag: status
                to: status
                transform: split_csv
    examples:
      - command: wps365-cli user get u123456
        description: 按 user_id 获取用户信息
      - command: wps365-cli user get u123456 --with-dept
        description: 获取用户信息并包含部门
      - command: 'wps365-cli user get "zhang@example.com,li@example.com" --type email --status active'
        description: 按邮箱批量查询用户
      - command: 'wps365-cli user get "13800138000,13900139000" --type phone --status active'
        description: 按手机号批量查询用户
      - command: 'wps365-cli user get "ext1,ext2" --type external-id --status active'
        description: 按外部 ID 批量查询用户
  - id: user.search
    command: user search
    summary: 搜索企业用户
    description: 搜索企业用户，支持按关键字和字段过滤。
    method: GET
    path: /v7/users/search
    response_schema_ref: "#/components/schemas/search_user_resp_body"
    flags:
      - name: keyword
        type: string
        required: true
        description: 搜索关键字
        to: query.keyword
      - name: page-size
        type: integer
        description: 分页大小
        to: query.page_size
      - name: status
        type: string[]
        required: false
        repeatable: true
        default:
          - active
        description: "用户状态过滤，可选值：active、notactive、disabled、dimission"
        to: query.status
        # TODO(F4): 待确认 API 是否接受 ?status=active,disabled 格式后，统一为逗号分隔
      - name: search-field
        type: string[]
        required: false
        repeatable: true
        default:
          - user_name
        description: "搜索字段，可选值：email、phone、user_name、login_name"
        to: query.search_field
        # TODO(F4): 待确认 API 是否接受逗号格式后，统一为逗号分隔
      - name: search-source
        type: string[]
        required: false
        repeatable: true
        default:
          - company_user
        description: "搜索来源，可选值：company_user、enterprise_partner"
        to: query.search_source
      - name: search-source-v2
        type: string[]
        required: false
        repeatable: true
        description: "搜索来源 v2，可选值：company_user、enterprise_partner"
        to: query.search_source_v2
      - name: user-type
        type: string[]
        required: false
        repeatable: true
        description: "用户类型，可选值：company_member、external_guest"
        to: query.user_type
      - name: page-token
        type: string
        required: false
        description: 分页标记
        to: query.page_token
      - name: with-total
        type: boolean
        required: false
        description: 是否返回总数
        to: query.with_total
      - name: id-type
        type: string
        required: false
        description: ID 类型
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    examples:
      - command: 'wps365-cli user search --keyword "张" --page-size 20'
        description: 搜索包含"张"的用户
      - command: 'wps365-cli user search --keyword "zhang@example.com" --page-size 10 --search-field email'
        description: 按邮箱搜索用户
  - id: user.dept.list
    command: user dept list
    summary: 获取用户所在部门列表
    description: 获取指定用户所在的部门列表，仅支持应用身份。
    method: GET
    path: /v7/users/{user_id}/depts
    response_schema_ref: "#/components/schemas/list_user_depts_resp_body"
    args:

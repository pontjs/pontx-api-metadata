  - id: meeting.list
    command: meeting list
    summary: 获取会议列表
    description: 获取指定时间范围的会议简要信息列表（60天内）。不传 join-code 返回已结束会议，传 join-code 返回进行中会议。
    method: GET
    path: /v7/meetings
    response_schema_ref: "#/components/schemas/list_meetings_resp_body"
    flags:
      - name: start
        type: string
        required: true
        description: 查询开始时间（unix 时间，单位 sec）
        to: query.start_time
      - name: end
        type: string
        required: true
        description: 查询结束时间（unix 时间，单位 sec）
        to: query.end_time
      - name: join-code
        type: string
        description: 入会码；传入时只返回进行中的会议，不传时只返回已结束的会议。应用身份下必须传入
        to: query.join_code
      - name: page-token
        type: string
        description: 分页标记
        to: query.page_token
      - name: page-size
        type: integer
        default: 20
        description: 分页大小，默认 20，最大 50
        to: query.page_size
    output:
      table_columns:
        - id
        - subject
        - join_code
        - join_url
    examples:
      - command: 'wps365-cli meeting list --start "1700000000" --end "1700086400"'
        description: 查询指定时间范围的会议列表

  - id: meeting.get
    command: meeting get
    summary: 获取会议详情
    description: 获取一个会议的详细数据。
    method: GET
    path: /v7/meetings/{meeting_id}
    response_schema_ref: "#/components/schemas/get_meeting_resp_body"
    args:
      - name: meeting-id
        required: true
        description: 会议 ID
        to: path.meeting_id
    flags:
      - name: id-type
        type: string
        description: 用户 ID 类型
    headers:
      - name: X-Kso-Id-Type
        from_flag: id-type
    output:
      table_columns:
        - id
        - subject
        - status
        - join_code
        - join_url
        - start_time
        - end_time
        - create_time
    examples:
      - command: wps365-cli meeting get mtg_abc123
        description: 查看会议详情

  - id: meeting.end
    command: meeting end
    summary: 结束会议
    description: 结束一个进行中的会议。
    method: POST
    path: /v7/meetings/{meeting_id}/end
    response_schema_ref: "#/components/schemas/end_meeting_resp_body"
    args:
      - name: meeting-id
        required: true

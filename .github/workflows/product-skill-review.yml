name: Independent product Skill review

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skills/**"
  workflow_dispatch:
    inputs:
      skills:
        description: "Comma-separated published Skill names to review"
        required: true
        default: "pontx-frankfurter-v2"

concurrency:
  group: product-skill-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      skills: ${{ steps.scope.outputs.skills }}
      base-sha: ${{ steps.event.outputs.base-sha }}
      head-sha: ${{ steps.event.outputs.head-sha }}
      is-pr: ${{ steps.event.outputs.is-pr }}
    steps:
      - name: Resolve immutable review event
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base-sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head-sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "is-pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "base-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "head-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "is-pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the exact review head without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.event.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce content-only review scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SKILLS: ${{ inputs.skills }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            skills=$(printf '%s' "$MANUAL_SKILLS" | tr -d '[:space:]')
            if [[ ! ",$skills," =~ ^,(pontx-[a-z0-9]+(-[a-z0-9]+)*)(,pontx-[a-z0-9]+(-[a-z0-9]+)*)*,$ ]]; then
              echo "Invalid manual product Skill list: $skills" >&2
              exit 1
            fi
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "skills=$skills" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eligible=true
          has_skill=false
          names_file=$(mktemp)
          while IFS= read -r path; do
            if [[ "$path" =~ ^skills/products/(pontx-[a-z0-9]+(-[a-z0-9]+)*)/(SKILL\.md|references/[a-z0-9]+(-[a-z0-9]+)*\.md)$ ]]; then
              printf '%s\n' "${BASH_REMATCH[1]}" >> "$names_file"
              has_skill=true
            elif [[ "$path" =~ ^skills/(manifests|evidence|evals)/(pontx-[a-z0-9]+(-[a-z0-9]+)*)\.json$ ]]; then
              printf '%s\n' "${BASH_REMATCH[2]}" >> "$names_file"
              has_skill=true
            elif [ "$path" != "skills/registry.json" ]; then
              eligible=false
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ] || [ "$has_skill" != true ]; then
            eligible=false
          fi
          skills=$(sort -u "$names_file" | paste -sd, -)
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "skills=$skills" >> "$GITHUB_OUTPUT"

  review:
    if: needs.classify.outputs.eligible == 'true' && (needs.classify.outputs.is-pr != 'true' || github.event.pull_request.draft == false)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic product Skill gates
        env:
          BASE_SHA: ${{ needs.classify.outputs.base-sha }}
        run: |
          pnpm skills:validate
          pnpm skills:test
          node scripts/verify-skill-version-bumps.mjs --base "$BASE_SHA"

      - name: Fetch and sanitize official evidence independently
        env:
          CHANGED_SKILLS: ${{ needs.classify.outputs.skills }}
        run: |
          node scripts/fetch-product-skill-evidence.mjs \
            --skills "$CHANGED_SKILLS" \
            --output .review-evidence

      - name: Run a fresh read-only DeepSeek review
        env:
          BASE_SHA: ${{ needs.classify.outputs.base-sha }}
          CHANGED_SKILLS: ${{ needs.classify.outputs.skills }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HEAD_SHA: ${{ needs.classify.outputs.head-sha }}
          REVIEW_OUTPUT: ${{ runner.temp }}/product-skill-review.json
        run: |
          node scripts/run-deepseek-product-skill-review.mjs \
            --skills "$CHANGED_SKILLS" \
            --evidence .review-evidence \
            --output "$REVIEW_OUTPUT" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Preserve the structured decision
        uses: actions/upload-artifact@v4
        with:
          name: product-skill-review-${{ needs.classify.outputs.head-sha }}
          path: ${{ runner.temp }}/product-skill-review.json
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: [classify, review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - name: Check out the independently reviewed head
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the structured review
        uses: actions/download-artifact@v4
        with:
          name: product-skill-review-${{ needs.classify.outputs.head-sha }}
          path: ${{ runner.temp }}/product-skill-review

      - name: Bind structured review to the exact head and every claim
        id: verify
        env:
          BASE_SHA: ${{ needs.classify.outputs.base-sha }}
          CHANGED_SKILLS: ${{ needs.classify.outputs.skills }}
          HEAD_SHA: ${{ needs.classify.outputs.head-sha }}
        run: |
          node scripts/verify-product-skill-review.mjs \
            --input "${{ runner.temp }}/product-skill-review/product-skill-review.json" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --skills "$CHANGED_SKILLS"
          echo "verified=true" >> "$GITHUB_OUTPUT"

  enable-auto-merge:
    if: github.event_name == 'pull_request' && needs.gate.outputs.verified == 'true'
    needs: [classify, review, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge only for the unchanged reviewed head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_HEAD: ${{ needs.classify.outputs.head-sha }}
        run: |
          current_head=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_head" != "$REVIEWED_HEAD" ]; then
            echo "PR head changed after independent review."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

  rollout-merged-content:
    if: github.event_name == 'pull_request' && needs.gate.outputs.verified == 'true'
    needs: [classify, review, gate, enable-auto-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Wait for the unchanged reviewed head to merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_HEAD: ${{ needs.classify.outputs.head-sha }}
        run: |
          deadline=$((SECONDS + 1500))
          while [ "$SECONDS" -lt "$deadline" ]; do
            current_head=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
            if [ "$current_head" != "$REVIEWED_HEAD" ]; then
              echo "PR head changed after independent review."
              exit 1
            fi
            merged_at=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged_at // ""')
            if [ -n "$merged_at" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Reviewed PR did not merge before the rollout deadline."
          exit 1

      - name: Dispatch the main metadata deployment and idempotent Skill rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run publish-product-skills.yml --repo "$GITHUB_REPOSITORY" --ref main

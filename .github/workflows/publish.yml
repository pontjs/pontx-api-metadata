name: Validate and publish metadata

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile

      - name: Test metadata contracts
        run: pnpm test

      - name: Validate product hierarchy
        run: pnpm validate

      - name: Verify deterministic product Skill registry
        run: pnpm skills:validate

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out API metadata
        uses: actions/checkout@v4
        with:
          path: metadata

      - name: Check out Pontx Hub
        uses: actions/checkout@v4
        with:
          repository: pontjs/pontx-hub
          path: pontx-hub

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Prepare clean Hub source
        run: |
          mkdir deploy-source
          git -C pontx-hub archive HEAD | tar -x -C deploy-source

      - name: Deploy Pontx Hub
        id: deploy
        env:
          METADATA_REPO_RAW_URL: https://raw.githubusercontent.com/pontjs/pontx-api-metadata/${{ github.sha }}
          METADATA_REPO_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel deployment secrets are not configured."
            exit 1
          fi
          target=()
          if [ "${{ github.ref_name }}" = "main" ]; then
            target+=(--prod)
          fi
          deployment_url=$(pnpm dlx vercel@latest deploy deploy-source \
            --yes \
            --force \
            --token "$VERCEL_TOKEN" \
            --scope pontjs \
            --build-env "METADATA_REPO_RAW_URL=$METADATA_REPO_RAW_URL" \
            --build-env "METADATA_REPO_COMMIT=$METADATA_REPO_COMMIT" \
            "${target[@]}")
          deployment_url=$(printf '%s\n' "$deployment_url" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "Vercel did not return a deployment URL."
            exit 1
          fi
          verification_url="$deployment_url"
          if [ "${{ github.ref_name }}" = "main" ]; then
            verification_url="https://pontx.dev"
          fi
          echo "verification_url=$verification_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed homepage, API, Schema, Endpoint, and SDK pages
        run: |
          node metadata/scripts/verify-deployed-hub.mjs \
            --base-url "${{ steps.deploy.outputs.verification_url }}" \
            --metadata-root metadata

      - name: Pin metadata commit for future Hub Git deployments
        if: github.ref_name == 'main'
        working-directory: pontx-hub
        run: |
          pnpm dlx vercel@latest env update METADATA_REPO_COMMIT production \
            --value "${{ github.sha }}" \
            --sensitive \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope pontjs

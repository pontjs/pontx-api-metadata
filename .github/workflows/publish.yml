name: Validate and publish metadata

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test locale lint rules
        run: node scripts/test-locales.mjs

      - name: Test SDK quality evidence rules
        run: node scripts/test-sdk-quality.mjs

      - name: Verify candidate API metadata
        run: node scripts/verify-candidates.mjs

      - name: Verify Dropbox Sign admitted contract
        run: node scripts/verify-dropbox-sign-candidate.mjs

      - name: Verify Stripe Identity admitted contract
        run: node scripts/verify-stripe-identity.mjs

      - name: Lint localized specifications
        run: node scripts/lint-locales.mjs

      - name: Rebuild catalog
        run: node scripts/build-catalog.mjs

      - name: Verify approved specifications
        run: node scripts/verify-specs.mjs

      - name: Check generated catalog is committed
        run: git diff --exit-code -- catalog/catalog.json

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out API metadata
        uses: actions/checkout@v4
        with:
          path: metadata

      - name: Check out Pontx Hub
        uses: actions/checkout@v4
        with:
          repository: pontjs/pontx-hub
          path: pontx-hub

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Prepare clean Hub source
        run: |
          mkdir deploy-source
          git -C pontx-hub archive HEAD | tar -x -C deploy-source

      - name: Deploy Pontx Hub
        id: deploy
        env:
          METADATA_REPO_RAW_URL: https://raw.githubusercontent.com/pontjs/pontx-api-metadata/${{ github.ref_name }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel deployment secrets are not configured."
            exit 1
          fi
          target=()
          if [ "${{ github.ref_name }}" = "main" ]; then
            target+=(--prod)
          fi
          deployment_url=$(pnpm dlx vercel@latest deploy deploy-source \
            --yes \
            --force \
            --token "$VERCEL_TOKEN" \
            --scope pontjs \
            --build-env "METADATA_REPO_RAW_URL=$METADATA_REPO_RAW_URL" \
            "${target[@]}")
          deployment_url=$(printf '%s\n' "$deployment_url" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "Vercel did not return a deployment URL."
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed homepage, API, Schema, Endpoint, and SDK pages
        run: |
          node metadata/scripts/verify-deployed-hub.mjs \
            --base-url "${{ steps.deploy.outputs.deployment_url }}" \
            --catalog metadata/catalog/catalog.json

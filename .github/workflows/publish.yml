name: Validate and publish metadata

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile

      - name: Test metadata contracts
        run: pnpm test

      - name: Validate product hierarchy
        run: pnpm validate

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out Pontx Hub
        uses: actions/checkout@v4
        with:
          repository: pontjs/pontx-hub
          path: pontx-hub

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Prepare clean Hub source
        run: |
          mkdir deploy-source
          git -C pontx-hub archive HEAD | tar -x -C deploy-source

      - name: Deploy Pontx Hub
        env:
          METADATA_REPO_RAW_URL: https://raw.githubusercontent.com/pontjs/pontx-api-metadata/${{ github.sha }}
          METADATA_REPO_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel deployment secrets are not configured."
            exit 1
          fi
          target=()
          if [ "${{ github.ref_name }}" = "main" ]; then
            target+=(--prod)
          fi
          pnpm dlx vercel@latest deploy deploy-source \
            --yes \
            --force \
            --no-wait \
            --token "$VERCEL_TOKEN" \
            --scope pontjs \
            --build-env "METADATA_REPO_RAW_URL=$METADATA_REPO_RAW_URL" \
            --build-env "METADATA_REPO_COMMIT=$METADATA_REPO_COMMIT" \
            "${target[@]}"
